name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 린트·빌드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  deploy:
    name: Vercel 배포
    needs: check
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      # main 푸시 = 운영 배포, PR = 미리보기 배포
      TARGET: ${{ github.event_name == 'push' && 'production' || 'preview' }}
      PROD: ${{ github.event_name == 'push' && '--prod' || '' }}
    # 포크에서 온 PR은 시크릿이 없으므로 배포하지 않는다
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: 시크릿 확인
        id: secrets
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::notice::Vercel 시크릿이 없어 배포를 건너뜁니다 (README의 배포 항목 참고)"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
      - name: 배포
        if: steps.secrets.outputs.ok == 'true'
        run: |
          npx --yes vercel@latest pull --yes --environment=$TARGET --token=$VERCEL_TOKEN
          npx --yes vercel@latest build $PROD --token=$VERCEL_TOKEN
          url=$(npx --yes vercel@latest deploy --prebuilt $PROD --token=$VERCEL_TOKEN)
          echo "배포 주소: $url" >> "$GITHUB_STEP_SUMMARY"
