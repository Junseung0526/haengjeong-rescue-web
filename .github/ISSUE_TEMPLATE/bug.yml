name: 버그 신고
description: 화면이 잘못 보이거나 동작이 이상할 때
labels: [bug]
body:
  - type: input
    id: where
    attributes: { label: 어느 화면인가요, placeholder: "예: /payroll 인건비 계산" }
    validations: { required: true }
  - type: textarea
    id: what
    attributes:
      label: 무슨 일이 있었나요
      description: 기대한 동작과 실제 동작, 다시 일으키는 순서를 적어 주세요. 실제 참여자 정보는 가려 주세요.
    validations: { required: true }
  - type: input
    id: env
    attributes: { label: 브라우저·화면 크기, placeholder: "예: Chrome 131, 1440px" }
